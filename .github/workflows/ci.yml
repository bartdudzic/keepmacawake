name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test and content scan
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Content scan
        run: scripts/scan-public-content.sh
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        # Against a fake keepmacawake command; nothing touches a real session.
        run: |
          npm ci
          npm test
